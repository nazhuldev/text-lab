<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Lab · Dịch, tóm tắt, cảm xúc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #15141F;
      --card: #1E1D2E;
      --card-soft: #26243A;
      --accent: #8C7AE6;
      --accent-soft: #5C4FBF;
      --teal: #4FD8C4;
      --negative: #FF6B6B;
      --text: #EDEDF7;
      --muted: #8B899E;
      --line: rgba(237, 237, 247, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(140, 122, 230, 0.14), transparent 45%),
        radial-gradient(circle at 90% 100%, rgba(79, 216, 196, 0.08), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .header .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: clamp(26px, 5vw, 36px);
      margin: 8px 0 0;
    }

    .header p {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
    }

    /* --- Tabs --- */
    .tabs {
      display: flex;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 5px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      text-align: center;
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }

    .tab.active {
      background: var(--accent);
      color: #15141F;
    }

    /* --- Panel --- */
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      display: none;
    }

    .panel.active {
      display: block;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      background: var(--card-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      padding: 14px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .row label {
      font-size: 13px;
      color: var(--muted);
    }

    select,
    input[type=number] {
      background: var(--card-soft);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13.5px;
    }

    button.run {
      margin-left: auto;
      background: var(--accent);
      color: #15141F;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button.run:hover {
      opacity: 0.9;
    }

    button.run:active {
      transform: scale(0.97);
    }

    button.run:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .result {
      margin-top: 18px;
      background: var(--card-soft);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      font-size: 14.5px;
      line-height: 1.7;
      min-height: 24px;
      display: none;
      white-space: pre-wrap;
    }

    .result.show {
      display: block;
    }

    .result.error {
      color: var(--negative);
    }

    /* --- Sentiment gauge --- */
    .gauge-wrap {
      margin-top: 18px;
      display: none;
    }

    .gauge-wrap.show {
      display: block;
    }

    .gauge-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .gauge-track {
      position: relative;
      height: 10px;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--negative), var(--card-soft), var(--teal));
    }

    .gauge-dot {
      position: absolute;
      top: 50%;
      width: 18px;
      height: 18px;
      background: var(--text);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 0 4px var(--card);
      transition: left 0.5s ease;
    }

    .sentiment-verdict {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 16px;
    }

    .sentiment-verdict .emoji {
      font-size: 26px;
    }

    .sentiment-detail {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 4px;
    }

    .footnote {
      text-align: center;
      color: var(--muted);
      font-size: 11.5px;
      margin-top: 24px;
      line-height: 1.6;
    }

    .footnote a {
      color: var(--teal);
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="header">
      <div class="eyebrow">Python + Flask · Xử lý ngôn ngữ đơn giản</div>
      <h1>Text Lab</h1>
      <p>Dịch, tóm tắt, và soi cảm xúc trong đoạn văn của mày</p>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="translate">🌐 Dịch thuật</div>
      <div class="tab" data-tab="summarize">✂️ Tóm tắt</div>
      <div class="tab" data-tab="sentiment">🎭 Cảm xúc</div>
    </div>

    <!-- TRANSLATE -->
    <div class="panel active" id="panel-translate">
      <textarea id="translateInput" placeholder="Dán đoạn văn cần dịch vào đây..."></textarea>
      <div class="row">
        <label>Dịch sang:</label>
        <select id="translateTarget">
          <option value="en">Tiếng Anh</option>
          <option value="vi">Tiếng Việt</option>
          <option value="ja">Tiếng Nhật</option>
          <option value="ko">Tiếng Hàn</option>
          <option value="zh-CN">Tiếng Trung</option>
          <option value="fr">Tiếng Pháp</option>
        </select>
        <button class="run" id="translateBtn">Dịch ngay</button>
      </div>
      <div class="result" id="translateResult"></div>
    </div>

    <!-- SUMMARIZE -->
    <div class="panel" id="panel-summarize">
      <textarea id="summarizeInput" placeholder="Dán đoạn văn dài cần tóm tắt vào đây..."></textarea>
      <div class="row">
        <label>Số câu giữ lại:</label>
        <input type="number" id="summarizeCount" value="3" min="1" max="10" style="width:60px;">
        <button class="run" id="summarizeBtn">Tóm tắt</button>
      </div>
      <div class="result" id="summarizeResult"></div>
    </div>

    <!-- SENTIMENT -->
    <div class="panel" id="panel-sentiment">
      <textarea id="sentimentInput" placeholder="Dán đoạn văn cần soi cảm xúc vào đây..."></textarea>
      <div class="row">
        <button class="run" id="sentimentBtn">Phân tích</button>
      </div>
      <div class="result error" id="sentimentError"></div>
      <div class="gauge-wrap" id="gaugeWrap">
        <div class="gauge-label"><span>Tiêu cực</span><span>Trung lập</span><span>Tích cực</span></div>
        <div class="gauge-track">
          <div class="gauge-dot" id="gaugeDot"></div>
        </div>
        <div class="sentiment-verdict">
          <span class="emoji" id="sentimentEmoji">😐</span>
          <span id="sentimentLabel">Trung lập</span>
        </div>
        <div class="sentiment-detail" id="sentimentDetail"></div>
      </div>
    </div>

    <div class="footnote">
      Tóm tắt & cảm xúc chạy hoàn toàn offline (rule-based). Dịch thuật cần internet.<br>
      © 2026 · Designed by <a href="https://github.com/nazhuldev" target="_blank">Kyu Dev</a>
    </div>
  </div>

  <script>
    // ====== CHUYỂN TAB ======
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
      });
    });

    // ====== HÀM GỌI API DÙNG CHUNG ======
    async function callApi(endpoint, body) {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      return res.json();
    }

    // ====== DỊCH THUẬT ======
    const translateBtn = document.getElementById('translateBtn');
    translateBtn.addEventListener('click', async () => {
      const text = document.getElementById('translateInput').value.trim();
      const target = document.getElementById('translateTarget').value;
      const resultEl = document.getElementById('translateResult');

      if (!text) return;

      translateBtn.disabled = true;
      translateBtn.textContent = 'Đang dịch...';
      resultEl.classList.remove('show', 'error');

      const data = await callApi('/api/translate', { text, target });

      if (data.error) {
        resultEl.textContent = data.error;
        resultEl.classList.add('show', 'error');
      } else {
        resultEl.textContent = data.result;
        resultEl.classList.add('show');
      }

      translateBtn.disabled = false;
      translateBtn.textContent = 'Dịch ngay';
    });

    // ====== TÓM TẮT ======
    const summarizeBtn = document.getElementById('summarizeBtn');
    summarizeBtn.addEventListener('click', async () => {
      const text = document.getElementById('summarizeInput').value.trim();
      const sentences = document.getElementById('summarizeCount').value;
      const resultEl = document.getElementById('summarizeResult');

      if (!text) return;

      summarizeBtn.disabled = true;
      summarizeBtn.textContent = 'Đang tóm tắt...';
      resultEl.classList.remove('show', 'error');

      const data = await callApi('/api/summarize', { text, sentences });

      if (data.error) {
        resultEl.textContent = data.error;
        resultEl.classList.add('show', 'error');
      } else {
        resultEl.textContent = data.result;
        resultEl.classList.add('show');
      }

      summarizeBtn.disabled = false;
      summarizeBtn.textContent = 'Tóm tắt';
    });

    // ====== CẢM XÚC ======
    const sentimentBtn = document.getElementById('sentimentBtn');
    sentimentBtn.addEventListener('click', async () => {
      const text = document.getElementById('sentimentInput').value.trim();
      const errorEl = document.getElementById('sentimentError');
      const gaugeWrap = document.getElementById('gaugeWrap');

      errorEl.classList.remove('show');
      gaugeWrap.classList.remove('show');

      if (!text) return;

      sentimentBtn.disabled = true;
      sentimentBtn.textContent = 'Đang phân tích...';

      const data = await callApi('/api/sentiment', { text });

      sentimentBtn.disabled = false;
      sentimentBtn.textContent = 'Phân tích';

      if (data.error) {
        errorEl.textContent = data.error;
        errorEl.classList.add('show');
        return;
      }

      // score chạy từ -1 đến 1 -> đổi sang % vị trí trên thanh gauge (0% - 100%)
      const pos = ((data.score + 1) / 2) * 100;
      document.getElementById('gaugeDot').style.left = pos + '%';

      const emojiMap = { positive: '😄', neutral: '😐', negative: '😞' };
      const labelMap = { positive: 'Tích cực', neutral: 'Trung lập', negative: 'Tiêu cực' };

      document.getElementById('sentimentEmoji').textContent = emojiMap[data.label];
      document.getElementById('sentimentLabel').textContent = labelMap[data.label];
      document.getElementById('sentimentDetail').textContent =
        `Tìm thấy ${data.positive} từ tích cực, ${data.negative} từ tiêu cực · điểm số: ${data.score}`;

      gaugeWrap.classList.add('show');
    });
  </script>

</body>

</html>
